name: Desplegar backend en Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Variable de repositorio opcional; si existe, manda sobre el nombre derivado.
      FLY_APP_VAR: ${{ vars.FLY_APP }}
      # Organizacion de Fly donde vive la app. Sin variable, la de la plantilla; un
      # proyecto montado por el instalador la trae como variable (de su
      # organizacion de GitHub o del repositorio).
      FLY_ORG: ${{ vars.FLY_ORG || 'desdemovil' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fly es opcional: sin secreto el workflow termina en verde con un aviso.
      # Tampoco se despliega un proyecto hijo que aun no ha pasado por
      # init-plantilla.yml: saldria con el nombre de la plantilla. Al terminar,
      # init-plantilla.yml lanza este workflow otra vez.
      - name: Comprobar si Fly esta configurado
        id: fly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly" >> "$GITHUB_STEP_SUMMARY"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly"
          elif [ -f .plantilla-pendiente ] \
               && [ "$(gh api "repos/${GITHUB_REPOSITORY}" -q .is_template)" != "true" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "Proyecto sin inicializar: se despliega cuando termine init-plantilla.yml" >> "$GITHUB_STEP_SUMMARY"
            echo "Proyecto sin inicializar: se despliega cuando termine init-plantilla.yml"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "Token presente (valor oculto). Organizacion de Fly: ${FLY_ORG}"
          fi

      # Nombre de la app: variable FLY_APP si existe; si no, <repo>-<owner> en
      # minusculas, saneado a [a-z0-9-] y recortado a 30 caracteres.
      - name: Determinar el nombre de la app
        id: app
        if: steps.fly.outputs.configurado == 'true'
        run: |
          if [ -n "${FLY_APP_VAR}" ]; then
            app="${FLY_APP_VAR}"
            origen="variable de repositorio FLY_APP"
          else
            nombre="${GITHUB_REPOSITORY#*/}"
            owner="${GITHUB_REPOSITORY%%/*}"
            app="$(printf '%s-%s' "${nombre}" "${owner}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9-' '-' \
              | cut -c1-30 \
              | sed 's/-*$//')"
            origen="derivado de ${GITHUB_REPOSITORY}"
          fi
          if [ -z "${app}" ]; then
            echo "::error::No se pudo determinar el nombre de la app de Fly."
            exit 1
          fi
          echo "App de Fly: ${app} (${origen})"
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Instalar flyctl
        if: steps.fly.outputs.configurado == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Crear la app si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl apps create "${FLY_APP}" --org "${FLY_ORG}" || true

      - name: Fijar BUILD_ID con el SHA del commit
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl secrets set "BUILD_ID=${GITHUB_SHA}" --app "${FLY_APP}" --stage

      # Las anotaciones del cliente viven en el volumen "datos" (app/fly.toml, [mounts]).
      # Se crea una vez; una maquina anterior sin volumen se retira para que el
      # despliegue cree la nueva ya con el volumen montado.
      - name: Preparar el volumen de datos
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          if flyctl volumes list --app "${FLY_APP}" --json | grep -q '"name": *"datos"'; then
            echo "Volumen datos ya existe"
          else
            flyctl volumes create datos --app "${FLY_APP}" --region "${region}" --size 1 --yes
          fi
          sin_volumen="$(flyctl machines list --app "${FLY_APP}" --json \
            | python3 -c 'import json,sys; print(" ".join(m["id"] for m in json.load(sys.stdin) if not (m.get("config") or {}).get("mounts")))')"
          for m in ${sin_volumen}; do
            echo "Retirando la maquina ${m} (sin volumen)"
            flyctl machine destroy "${m}" --app "${FLY_APP}" --force
          done

      - name: Desplegar en Fly.io
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl deploy app --app "${FLY_APP}" --remote-only --ha=false

      - name: Verificar /salud
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          url="https://${FLY_APP}.fly.dev/salud"
          echo "Verificando ${url} (se espera build=${SHA})"
          for intento in $(seq 1 10); do
            respuesta="$(curl -fsS --max-time 20 "${url}" || true)"
            echo "Intento ${intento}/10: ${respuesta:-<sin respuesta>}"
            if printf '%s' "${respuesta}" | grep -q "${SHA}"; then
              echo "OK: /salud responde con el build ${SHA}"
              exit 0
            fi
            if [ "${intento}" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "::error::/salud no devolvio el SHA ${SHA} tras 10 intentos (150 s)."
          exit 1

      # Lo que consume docs/holamundo.html desde Pages: cuerpo exacto y CORS.
      - name: Verificar /holamundo
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/holamundo"
          cabeceras="$(curl -fsS --max-time 20 -D - -o /tmp/cuerpo "${url}")"
          cuerpo="$(cat /tmp/cuerpo)"
          echo "Respuesta: ${cuerpo}"
          [ "${cuerpo}" = "holamundo" ] || { echo "::error::/holamundo devolvio '${cuerpo}'"; exit 1; }
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::/holamundo sin cabecera CORS"; exit 1; }
          echo "OK: /holamundo responde 'holamundo' con CORS"

      # El saludo de la app: lo pide el instalador al terminar y el boton
      # "Saluda" de la ficha. Tiene que ser JSON, con CORS, con el nombre del
      # proyecto, decir que responde desde Fly.io y llevar el SHA desplegado.
      - name: Verificar /hola
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          url="https://${FLY_APP}.fly.dev/hola"
          cabeceras="$(curl -fsS --max-time 20 -D - -o /tmp/hola.json "${url}")"
          echo "Respuesta: $(cat /tmp/hola.json)"
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::/hola sin cabecera CORS"; exit 1; }
          NOMBRE="${GITHUB_REPOSITORY#*/}" python3 - <<'PY'
          import json, os, sys
          d = json.load(open('/tmp/hola.json'))
          fallos = []
          if d.get('app') != os.environ['NOMBRE']:
              fallos.append(f"app={d.get('app')!r}, se esperaba {os.environ['NOMBRE']!r}")
          if 'Fly.io' not in d.get('mensaje', ''):
              fallos.append(f"mensaje={d.get('mensaje')!r} no dice Fly.io")
          if d.get('version') != os.environ['SHA']:
              fallos.append(f"version={d.get('version')!r}, se esperaba el SHA")
          for campo in ('fecha', 'region', 'maquina'):
              if not d.get(campo):
                  fallos.append(f"falta {campo}")
          if fallos:
              print('::error::/hola: ' + '; '.join(fallos))
              sys.exit(1)
          print('OK: ' + d['mensaje'] + ' (' + d['region'] + ', ' + d['fecha'] + ')')
          PY

      # Las anotaciones del cliente (docs/anotar/): se acepta un envio de prueba,
      # la lectura sin clave se rechaza y el preflight CORS responde.
      - name: Verificar /anotaciones
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/anotaciones"
          datos='{"formato":"anotacion-prupru/2","tipo":"captura","meta":{"proyecto":"verificacion","pagina":"deploy.yml","titulo":"Prueba del despliegue","build":"'"${GITHUB_SHA}"'"},"nota":"Envio de prueba de deploy.yml; se puede borrar.","formas":[]}'
          codigo="$(curl -sS --max-time 30 -o /tmp/anot.json -w '%{http_code}' -F "datos=${datos};type=application/json" "${url}")"
          echo "POST: ${codigo} $(cat /tmp/anot.json)"
          [ "${codigo}" = "201" ] || { echo "::error::POST /anotaciones devolvio ${codigo}"; exit 1; }
          codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${url}")"
          [ "${codigo}" = "401" ] || { echo "::error::GET /anotaciones sin clave devolvio ${codigo}, se esperaba 401"; exit 1; }
          cabeceras="$(curl -sS --max-time 20 -X OPTIONS -D - -o /dev/null "${url}")"
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' || { echo "::error::OPTIONS /anotaciones sin CORS"; exit 1; }
          echo "OK: /anotaciones acepta envios, protege la lectura y responde al preflight"

      - name: Resumen del despliegue
        if: success() && steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          {
            echo "### Backend desplegado en Fly.io"
            echo ""
            echo "- App: \`${FLY_APP}\` (region \`${region}\`, organizacion de Fly \`${FLY_ORG}\`)"
            echo "- URL: https://${FLY_APP}.fly.dev/"
            echo "- Salud: https://${FLY_APP}.fly.dev/salud"
            echo "- Hola mundo: https://${FLY_APP}.fly.dev/holamundo"
            echo "- Saludo: https://${FLY_APP}.fly.dev/hola"
            echo "- Anotaciones del cliente: https://${FLY_APP}.fly.dev/anotaciones (panel: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/anotar/panel.html)"
            echo "- Comprobacion desde Pages: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/holamundo.html"
            echo "- Build (SHA): \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
