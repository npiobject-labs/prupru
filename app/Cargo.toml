[package]
name = "prupru-backend"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
serde_json = "1"
# Solo para crear el issue en GitHub cuando hay GITHUB_TOKEN; TLS sin OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
